name: release

# Runs GoReleaser on every vX.Y.Z tag push and publishes a GitHub Release on
# this (private) repo. Build/test-on-every-commit CI lives in a separate
# workflow (see CLA-18) — this one only cuts releases.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # The default token is scoped to this repo and is sufficient: the
          # release target (release.github.owner/name in .goreleaser.yaml)
          # is this same repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
