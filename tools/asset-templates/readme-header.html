<!doctype html><html><head><meta charset=utf-8><style>@font-face{font-family:"Press Start 2P";src:url(../../site/fonts/press-start-2p-v15-latin-regular.woff2) format("woff2");font-display:block}
:root{--void:#0e0a06;--panel:#17110b;--ember:#ff8a1f;--ember-dim:#b85a10;--cyan:#4de8ff;--red:#ff4d4d;--hi:#f3ece4;--mut:#b3a89b;--edge:#3a2f24}
*{margin:0;box-sizing:border-box}
.disp{font-family:"Press Start 2P",monospace}.body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:multiply}
