<!doctype html><html><head><meta charset=utf-8><style>@font-face{font-family:"Press Start 2P";src:url(../../site/fonts/press-start-2p-v15-latin-regular.woff2) format("woff2");font-display:block}
:root{--void:#0e0a06;--panel:#17110b;--ember:#ff8a1f;--ember-dim:#b85a10;--cyan:#4de8ff;--red:#ff4d4d;--hi:#f3ece4;--mut:#b3a89b;--edge:#3a2f24}
*{margin:0;box-sizing:border-box}
.disp{font-family:"Press Start 2P",monospace}.body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:multiply}
html,body{width:1200px;height:630px;background:var(--void);overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;justify-content:center;padding:0 88px}
.eyebrow{color:var(--mut);font-size:15px;letter-spacing:.14em}
.wm{color:var(--ember);font-size:76px;line-height:1.15;margin:22px 0 6px;text-shadow:0 0 24px rgba(255,138,31,.28)}
.tag{color:var(--hi);font-size:26px;line-height:1.55;max-width:1000px;margin-top:18px}
.chip{display:inline-flex;gap:14px;margin-top:34px}
/* Same shape/spec as the shipped .handle-pill (site/retro.css): pill
   radius, steel border, mono text — this page is a standalone screenshot
   target with no retro.css, so the rule is duplicated here by name only,
   not reinvented with different geometry. */
.handle-pill{border:2px solid #6b7280;border-radius:999px;color:var(--hi);font-size:19px;padding:9px 18px}
.red{background:var(--red);color:var(--void);border-radius:2px;font-size:17px;padding:9px 16px}
.foot{position:absolute;left:88px;bottom:40px;color:var(--mut);font-size:16px}
</style></head><body><div class="wrap">
<div class="eyebrow body">SECRET MANAGER FOR AI CODING AGENTS</div>
<div class="wm disp">CLAUDEPASS</div>
<div class="tag body">Your AI agent uses a Secret without ever reading it. It sees a <b style="color:var(--ember)">Handle</b>, never the value.</div>
<div class="chip body"><span class="handle-pill">stripe/live</span><span class="red disp">[REDACTED]</span></div>
<div class="foot body">claudepass.com · brew install softorize/tap/cpass</div>
<div class="scan"></div></div></body></html>
