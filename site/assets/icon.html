<!doctype html><html><head><meta charset=utf-8><style>@font-face{font-family:"Press Start 2P";src:url(/fonts/press-start-2p-v15-latin-regular.woff2) format("woff2");font-display:block}
:root{--void:#0e0a06;--panel:#17110b;--ember:#ff8a1f;--ember-dim:#b85a10;--cyan:#4de8ff;--red:#ff4d4d;--hi:#f3ece4;--mut:#b3a89b;--edge:#3a2f24}
*{margin:0;box-sizing:border-box}
.disp{font-family:"Press Start 2P",monospace}.body{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:multiply}
html,body{width:512px;height:512px;background:var(--void);overflow:hidden}
.wrap{position:relative;width:512px;height:512px;display:flex;align-items:center;justify-content:center}
.vault{width:300px;height:300px;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 10px 10px 0 #3a2f24,inset -10px -10px 0 #080603}
.dial{width:150px;height:150px;border-radius:999px;border:16px solid var(--ember);display:flex;align-items:center;justify-content:center}
.slot{width:22px;height:78px;background:var(--ember);border-radius:3px}
</style></head><body><div class="wrap"><div class="vault"><div class="dial"><div class="slot"></div></div></div><div class="scan"></div></div></body></html>
