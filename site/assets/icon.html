<!doctype html><html><head><meta charset=utf-8><style>
/* App-icon generator (screenshot at 512x512 -> icon.png / favicon-512.png).
   Renders the same canon Vault Glyph (Door + Dial + Handle,
   canon-wordmark-type.md) as the header brand-glyph / favicon SVGs, scaled
   up from the identical 16-unit proportions so all three are recognizably
   one mark: Door = full square (radius-none), Dial = circle 37.5% of the
   Door's width centered in it, Handle = a thin vertical bar right-of-center. */
*{margin:0;box-sizing:border-box}
:root{--void:#0e0a06;--ember:#ff8a1f}
html,body{width:512px;height:512px;background:var(--void);overflow:hidden}
.wrap{position:relative;width:512px;height:512px}
.door{position:absolute;inset:0;background:var(--ember);border-radius:0}
.dial{position:absolute;left:160px;top:160px;width:192px;height:192px;border-radius:999px;background:var(--void)}
.handle{position:absolute;left:384px;top:192px;width:64px;height:160px;background:var(--void)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 4px);pointer-events:none;mix-blend-mode:multiply}
</style></head><body><div class="wrap"><div class="door"></div><div class="dial"></div><div class="handle"></div><div class="scan"></div></div></body></html>
