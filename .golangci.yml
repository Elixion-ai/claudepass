# Small, deliberately unopinionated golangci-lint config for CLA-18.
#
# linters.default: standard enables golangci-lint's own default set:
# govet, ineffassign, staticcheck, unused, errcheck. errcheck was disabled
# at first (~80 pre-existing findings; see CLA-18) and re-enabled by
# CLA-37, which checked or explicitly ignored every finding — an ignored
# one is always a `_ = expr` (or `_, _ = expr`) with a short comment
# explaining why the error is genuinely irrelevant there (e.g. a
# best-effort write to the CLI's own stdout/stderr, or the standard
# defer-Rollback-after-Commit idiom), never a blanket linter suppression.
#
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  # internal/cli/testhooks_on.go (the e2e test-hook shims) only builds
  # under this tag; lint it the same way `go vet -tags e2e ./...` does so
  # it isn't silently skipped.
  build-tags:
    - e2e

linters:
  default: standard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
